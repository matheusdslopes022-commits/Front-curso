<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <div>
        <p id="p">Clique aqui</p>

        alert("O paragrafo foi clicado")
    })
</script>
