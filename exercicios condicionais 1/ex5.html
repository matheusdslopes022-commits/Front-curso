<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let numero = Number(prompt("Digite um numero"));

    if(numero > 20){
        document.writeln("Numero maior que 20");
    } else if (numero < 20){
        document.writeln("Numero menor que 20")
    } else {
        document.writeln("Numero igual a 20")
    }
</script>

</body>
</html>
