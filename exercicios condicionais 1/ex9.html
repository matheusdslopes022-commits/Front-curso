<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let altura = Number(prompt("Digite sua altura:"));
    let sexo = prompt("Digite seu sexo f para feminino e m para masculino");
    let peso;

    if(sexo == 'm'){
        peso = (72.7 * altura) - 58
        document.write("Seu peso ideal eh " + peso.toFixed(2));
    } else if (sexo == 'f'){
        peso = (62.1 * altura) - 44.7
        document.write("Seu peso ideal eh " + peso.toFixed(2));
    }
</script>

</body>
</html>
