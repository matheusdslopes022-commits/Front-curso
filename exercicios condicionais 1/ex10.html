<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let n1 = Number(prompt("Digite o primeiro número:"));
    let n2 = Number(prompt("Digite o segundo número:"));
    let n3 = Number(prompt("Digite o terceiro número:"));

   
    if (n1 > 0) {
        document.writeln("Número vezes 10: " + (n1 * 10) + "<br>");
    } else {
        document.writeln("Número ao quadrado: " + (n1 * n1) + "<br>");
    }

 
    if (n2 < 0) {
        document.writeln("NÚMERO NEGATIVO<br>");
    }

    if (n3 < n2) {
        document.write("Diferença: " + (n2 - n3) + "<br>");
    } else {
        document.writeln("Número 3 somando 1: " + (n3 + 1) + "<br>");
    }
</script>
<body>
    
</body>
</html>
