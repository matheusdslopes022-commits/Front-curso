<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let numero = Number(prompt("Digite um numero"));

    if(numero > 100){
        document.write("o numero " + numero + " é maior que 100");
    } else if(numero < 100) {
        document.write("o numero " + numero + " é menor que 100");
    } else {
        document.write("O numero é igual a 100")
    }
</script>
