<script>
    let valorhora = Number(prompt("Digite o valor da hora:"));
    let numeroaulas = Number(prompt("Digite o número de aulas:"));
    let salario = (valorhora * numeroaulas) - (valorhora * numeroaulas * 0.11);

    alert("O salário do professor é: " + salario);
</script>
