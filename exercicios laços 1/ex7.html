<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let a = Number(prompt("Digite um numero"));
    let b = Number(prompt("Digite um numero"));


    if (a > b) {
        for (let i = a; i >= b; i--) {
            document.write(i + " ");
        }
    } else {
        for (let i = a; i <= b; i++) {
            document.write(i + " ");
        }
    }

</script>

</html>
