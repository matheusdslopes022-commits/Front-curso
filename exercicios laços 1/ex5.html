<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    for(let i = 0; i < 10; i++){
        let numero = Number(prompt("Digite um numero"));

        if(numero % 3 == 0){
            document.writeln(numero+" é divisivel por 3 <br>");
        } else {
            document.writeln(numero+" não é divisivel por 3 <br>");
        }
        
    }
</script>
<body>
    
</body>
</html>
