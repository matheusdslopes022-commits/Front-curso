<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let encontrado;
    for(let i = 0; i < 10; i++){
        let nota = Number(prompt("Digite uma nota:"));
        
        if(nota === 10){
            encontrado = true;
        }

        document.writeln("nota " + (i + 1) + ": " + nota + "<br>");
        
    }

    if(encontrado == true){
            document.writeln("Nota maxima encontrado");
        } else {
            document.writeln("Nota não maxima encontrado");     
        }
</script>
