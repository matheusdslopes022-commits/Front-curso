<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let numero = Number(prompt("Digite um numero"));
    let ehPrimo = numero > 1;

    for (let i = 2; i * i <= numero; i++) {
        if (numero % i === 0) {
            ehPrimo = false;
            break;  
        }
    }

    if (ehPrimo) {
        document.writeln(`${numero} é primo`);
    } else {
        document.writeln(`${numero} não é primo`);
    }


</script>

<body>

</body>

</html>
