<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let a = Number(prompt("Digite um numero"));
    let b = Number(prompt("Digite um numero"));
 

        document.writeln("Numeros entre " + a + " e " + b + " crescente <br>")
        for (let i = a; i <= b; i++) {
            document.write(i + " ");
        }

        document.writeln("<br>Numeros entre " + a + " e " + b + " decrescente <br>")
        for (let i = b; i >= a; i--) {
            document.write(i + " ");
        }


</script>

</body>

</html>
