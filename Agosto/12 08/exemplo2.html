<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let idade = Number(prompt("Digite sua idade"));

    if(idade > 0 && idade <= 6){
        document.writeln("Educação infantil");
    } else if(idade > 6 && idade <= 11){
        document.writeln("Fundamental");
    } else if (idade > 11 && idade <= 14){
        document.writeln("Fundamental 2");
    } else if (idade > 14 && idade <= 17){
        document.writeln("Ensino medio");
    } else if (idade > 17 && idade <= 30){
        document.writeln("Ensino Superior");
    } else {
        document.writeln("Não sei responder");
    }
</script>

</body>
</html>
