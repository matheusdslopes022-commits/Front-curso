<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let numero = Number(prompt("Digite um numero"));
    let numero2 = Number(prompt("Digite um numero"));

    let maior;
    let menor;

    if(numero > numero2){
        maior = numero;
        menor = numero2;
    } else {
        maior = numero2;
        menor = numero;
    }

    document.write("A diferença do maior pelo menor eh " + (maior - menor))
</script>
