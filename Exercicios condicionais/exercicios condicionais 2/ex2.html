<script>
    let idade = Number(prompt("Digite sua idade"));

    if(idade < 16){
        document.writeln("não eleitor");
    } else if (idade >= 16 && idade < 18 || idade > 65){
        document.writeln("eleitor facultativo");
    } else{
        document.writeln("eleitor obrigatorio");
    }
</script>
