<script>
    let aprovados = 0;
    let reprovados = 0;
    let maior = 0;
    let menor = 10;


    for(let i = 0; i < 20; i++){
        let nota = Number(prompt("Digite a Nota: "));

        if(nota >= 6){
            aprovados++;
        } else {    
            reprovados++;
        }

        if(nota > maior){
            maior = nota
        }
        
        if(nota < menor ){
            menor = nota
        }
    }

    document.writeln("A quantidade de aprovados: " + aprovados + "<br>");
    document.writeln("A quantidade de reprovados: " + reprovados+ "<br>");
    document.writeln("A Maior nota foi: " + maior+ "<br>");
    document.writeln("A Menor nota foi: " + menor);

</script>
