<script>
    let a = Number(prompt("Digite um Numero"));
    let b = Number(prompt("Digite um Numero"));
    let soma = 0;

    if(a<b){
        for(let i = a; i <= b; i++){
            soma += i;
        }

        document.writeln("Soma dos numeros " + a +" a " + b + " eh " + soma);
    }
</script>
