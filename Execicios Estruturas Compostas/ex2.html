<script>
    let D = [];

    for(let i = 0; i < 10; i ++){
        d = Number(prompt("Digite um numero"));
        D.push(d);
    }

    document.writeln("Vetor D:<br>")
    document.writeln(D +" ");

    let F = [];
    for(let i = 0; i < 10; i++){
        F.push(D[i]);
    }

    document.writeln("<br>Vetor F com valres de D:<br>")
    document.writeln(F +" ");
</script>
