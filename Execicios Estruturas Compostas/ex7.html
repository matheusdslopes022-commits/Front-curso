<script>
    let A = [];
    let B = [];
    let soma = [];

    for (let i = 0; i < 5; i++) {
        let a = Number(prompt("Digite numeros do vetor a:"));
        A.push(a);
    }

    for (let i = 0; i < 5; i++) {
        let b = Number(prompt("Digite numeros do vetor b:"));
        B.push(b);
    }

    for (let i = 0; i < 5; i++) {
        soma.push(A[i] + B[i]);
    }

    document.writeln("Vetor a: "+ A + " ");
    document.writeln("<br>");
    document.writeln("Vetor b: "+ B + " ");
    document.writeln("<br>");
    document.writeln("Vetor soma: "+ soma + " ");
</script>
