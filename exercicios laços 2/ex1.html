<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let num;
    do{
        num = Number(prompt("Digite um numero: (0 para encerrar)"));

        if(num > 0){
            document.writeln(num+" eh positivo <br>");
        } else if (num < 0) {
            document.writeln(num+" eh negativo <br>");
        }
    } while(num != 0);
</script>
<body>
    
</body>
</html>
