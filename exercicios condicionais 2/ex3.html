<script>
    let a = Number(prompt("Digite um numero"));
    let b = Number(prompt("Digite um numero"));

    if(a % b == 0 || b % a == 0){
        document.writeln("São multiplos");
    } else {
        document.writeln("Não são multiplos");
    }
</script>
