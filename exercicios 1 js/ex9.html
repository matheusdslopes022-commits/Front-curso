<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let valor = Number(prompt("Digite o valor original da prestação:"));
    let tempo = Number(prompt("Digite o tempo em atraso (meses):"));
    let taxa = Number(prompt("Digite a taxa de juros (%):"));

    let prestacao = valor + (valor * (taxa / 100) * tempo);

    alert("O valor da prestação em atraso é: R$ " + prestacao.toFixed(2));
</script>

</body>

</html>
